profile_name: "deep_ocean_exploration"
profile_version: "7.0.0"
description: "Immersive underwater ambience and restrained low-frequency textures paired with longer, unhurried abyssal ROV and marine expedition shots."

narrative_retention:
  category_focus: "Deep-ocean exploration, abyssal trenches, hydrothermal vents, brine lakes, and marine fieldwork"
  default_target_duration_range_s: [65.0, 140.0]
  preferred_beat_structure:
    - "opening_hook"
    - "curiosity_gap"
    - "evidence_and_discovery"
    - "escalation"
    - "payoff"
    - "final_impression"
  preferred_hook_archetypes:
    - "surprising_visual"
    - "unusual_real_event"
    - "credible_mystery"
  max_info_drought_s: 16.0
  min_central_payoff_time_fraction: 0.28

asset_selection:
  target_moving_footage_ratio: 0.82
  max_still_photo_ratio: 0.16
  prefer_human_fieldwork_interaction: true
  min_human_interaction_shots: 1
  min_distinct_perspectives: 3
  scoring_weights:
    direct_relevance: 0.32
    visual_clarity: 0.22
    authenticity: 0.22
    technical_quality: 0.08
    composition_potential: 0.08
    motion_storytelling: 0.05
    license_verification: 0.03
    min_direct_relevance_floor: 0.35

sound_design:
  default_voice: "en-GB-RyanNeural"
  default_voice_profile: "calm_exploration"
  scene_audio_profile: "deep_ocean_abyss"
  adaptive_audio_profile: "immersive_exploration"
  enable_5layer_mixing: true
  enable_diegetic_nat_sound: true
  allow_no_music: true
  target_bed_lufs: -27.5
  music_layer_gain_db: -21.5
  ambience_layer_gain_db: -20.5
  natural_sounds_layer_gain_db: -16.5
  cinematic_sfx_layer_gain_db: -26.0
  music_duck_under_speech_db: -10.5
  music_duck_important_phrase_db: -15.0

pacing:
  adaptive_duration_enabled: true
  enable_intelligent_scene_editing: true
  reference_shot_duration_range_s: [4.4, 8.8]
  establishing_wide_bonus_s: 1.3
  min_shot_duration_s: 2.6
  max_shot_duration_s: 16.0
  dissolve_duration_s: 0.65
  max_dissolve_fraction_of_cuts: 0.38

color_science:
  enable_filmic_grade: true
  cast_tame_strength: 0.22
  luma_grain_sigma: 1.9

subtitles:
  style: "cinema_boxless"
  emphasis_mode: "color_accent"
  enable_keyword_color_flash: true
  word_by_word_animation: false

opening_and_thumbnail:
  thumbnail_text_mode: "cinema_hook"
  thumbnail_max_words: 6
  thumbnail_concepts_count: 3
