profile_name: "deep_ocean_documentary"
profile_version: "6.0.0"
description: "Deep-sea mysteries, abyssal ROV expeditions, brine pools, hydrothermal vents, and hadal biology."

narrative_retention:
  category_focus: "Deep-sea mysteries, ROV exploration, abyssal geology, and extreme marine ecosystems"
  default_target_duration_range_s: [70.0, 90.0]
  preferred_beat_structure:
    - "opening_hook"
    - "curiosity_gap"
    - "evidence_and_discovery"
    - "escalation"
    - "payoff"
    - "final_impression"
  preferred_hook_archetypes:
    - "surprising_visual"
    - "unusual_real_event"
    - "credible_mystery"
  max_info_drought_s: 14.0
  min_central_payoff_time_fraction: 0.30

asset_selection:
  target_moving_footage_ratio: 0.85
  max_still_photo_ratio: 0.12
  prefer_human_fieldwork_interaction: true
  min_human_interaction_shots: 2
  min_distinct_perspectives: 4
  scoring_weights:
    direct_relevance: 0.30
    visual_clarity: 0.22
    authenticity: 0.22
    technical_quality: 0.08
    composition_potential: 0.08
    motion_storytelling: 0.06
    license_verification: 0.04
    min_direct_relevance_floor: 0.35

sound_design:
  default_voice: "en-GB-RyanNeural"
  default_voice_profile: "curious_explorer"
  scene_audio_profile: "deep_ocean_abyss"
  enable_5layer_mixing: true
  enable_diegetic_nat_sound: true
  target_bed_lufs: -26.0
  music_layer_gain_db: -20.5
  ambience_layer_gain_db: -20.0
  natural_sounds_layer_gain_db: -15.5
  cinematic_sfx_layer_gain_db: -25.0

pacing:
  adaptive_duration_enabled: true
  reference_shot_duration_range_s: [4.0, 7.6]
  establishing_wide_bonus_s: 1.2
  min_shot_duration_s: 2.5
  max_shot_duration_s: 14.0
  dissolve_duration_s: 0.65
  max_dissolve_fraction_of_cuts: 0.40

color_science:
  enable_filmic_grade: true
  cast_tame_strength: 0.24
  luma_grain_sigma: 2.0

subtitles:
  style: "cinema_boxless"
  emphasis_mode: "color_accent"
  enable_keyword_color_flash: true
  word_by_word_animation: false

opening_and_thumbnail:
  thumbnail_text_mode: "cinema_hook"
  thumbnail_max_words: 6
  thumbnail_concepts_count: 3
