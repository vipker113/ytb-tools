profile_name: "scientific_investigation"
profile_version: "7.0.0"
description: "Clear authoritative narration, minimal background sound, rare sound effects, and information-first documentary editing."

narrative_retention:
  category_focus: "Empirical scientific investigation, laboratory & field measurements, instrumentation, and physical mechanisms"
  default_target_duration_range_s: [35.0, 140.0]
  preferred_beat_structure:
    - "opening_hook"
    - "curiosity_gap"
    - "evidence_and_discovery"
    - "payoff"
    - "final_impression"
  preferred_hook_archetypes:
    - "unexpected_fact"
    - "paradox"
    - "surprising_visual"
  max_info_drought_s: 14.5
  min_central_payoff_time_fraction: 0.25

asset_selection:
  target_moving_footage_ratio: 0.72
  max_still_photo_ratio: 0.24
  prefer_human_fieldwork_interaction: true
  min_human_interaction_shots: 1
  min_distinct_perspectives: 3
  scoring_weights:
    direct_relevance: 0.36
    visual_clarity: 0.24
    authenticity: 0.20
    technical_quality: 0.08
    composition_potential: 0.06
    motion_storytelling: 0.03
    license_verification: 0.03
    min_direct_relevance_floor: 0.38

sound_design:
  default_voice: "en-GB-RyanNeural"
  default_voice_profile: "scientific_authority"
  scene_audio_profile: "minimal_investigation"
  adaptive_audio_profile: "scientific_explanation"
  enable_5layer_mixing: true
  enable_diegetic_nat_sound: true
  allow_no_music: true
  target_bed_lufs: -31.0
  music_layer_gain_db: -25.0
  ambience_layer_gain_db: -25.5
  natural_sounds_layer_gain_db: -18.5
  cinematic_sfx_layer_gain_db: -28.0
  music_duck_under_speech_db: -12.5
  music_duck_important_phrase_db: -16.5

pacing:
  adaptive_duration_enabled: true
  enable_intelligent_scene_editing: true
  reference_shot_duration_range_s: [3.8, 7.8]
  establishing_wide_bonus_s: 0.9
  min_shot_duration_s: 2.5
  max_shot_duration_s: 15.0
  dissolve_duration_s: 0.50
  max_dissolve_fraction_of_cuts: 0.25

color_science:
  enable_filmic_grade: true
  cast_tame_strength: 0.16
  luma_grain_sigma: 1.6

subtitles:
  style: "scientific_plain"
  emphasis_mode: "color_accent"
  enable_keyword_color_flash: true
  word_by_word_animation: false

opening_and_thumbnail:
  thumbnail_text_mode: "cinema_hook"
  thumbnail_max_words: 6
  thumbnail_concepts_count: 3
