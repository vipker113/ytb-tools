factual_references:
  - citation: "Marques, O. A. V., Martins, M., Develey, P. F., Macarrão, A., & Sazima, I. (2012) / Instituto Butantan — Population ecology, arboreal foraging, and avian diet of Bothrops insularis on Ilha da Queimada Grande, São Paulo, Brazil."
    url: "https://butantan.gov.br/"
    supported_claims: "Total population estimated at ~2,000–4,000 Bothrops insularis across 43 hectares (~50–90 vipers per hectare in forest habitat; no scientific evidence for the 1–5 snakes per m² urban myth); semi-arboreal ambush foraging on migratory passerine birds."
  - citation: "Guimarães, M., Munguía-Steyer, R., Doherty, P. F., Martins, M., & Sawaya, R. J. — Post-glacial sea-level isolation (~11,000 years BP) of Ilha da Queimada Grande 33 km off São Paulo."
    url: "https://www.iucnredlist.org/"
    supported_claims: "Rising Holocene sea levels ~11,000 years ago submerged the continental-shelf connection to mainland Brazil, isolating ancestral Bothrops jararaca populations without terrestrial mammalian prey."
  - citation: "Zelanis, A. et al. / Instituto Butantan Toxinology — Differential venom potency of Bothrops insularis toward avian prey."
    url: "https://pubmed.ncbi.nlm.nih.gov/"
    supported_claims: "Bothrops insularis venom exhibits up to fivefold higher lethality against avian prey than mainland relatives, causing rapid immobilization and tissue necrosis so struck birds cannot fly off the island."
  - citation: "Marinha do Brasil / ICMBio — ARIE das Ilhas Queimada Pequena e Queimada Grande Restricted Access & Automated 1909 Lighthouse."
    url: "https://www.gov.br/icmbio/pt-br"
    supported_claims: "Civilian landing is prohibited by the Brazilian Navy and ICMBio except for permitted scientific teams and Navy maintenance of the automated 1909 lighthouse."
