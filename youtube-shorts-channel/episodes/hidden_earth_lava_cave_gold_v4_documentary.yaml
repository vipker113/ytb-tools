  # N04 (27 words: 0..26)
  - { seg_id: "N04", first_word_idx: 0, last_word_idx: 5, text: "To avoid drowning in cave moisture," }
  - { seg_id: "N04", first_word_idx: 6, last_word_idx: 12, text: "the colony weaves a microscopic water-repellent fuzz." }
  - { seg_id: "N04", first_word_idx: 13, last_word_idx: 20, text: "Millions of beaded droplets act like tiny lenses—" }
  - { seg_id: "N04", first_word_idx: 21, last_word_idx: 26, text: "bouncing headlamp beams back as gold." }
  # N05 (24 words: 0..23)
  - { seg_id: "N05", first_word_idx: 0, last_word_idx: 8, text: "Wearing sterile gloves, NASA teams scan these fragile walls" }
  - { seg_id: "N05", first_word_idx: 9, last_word_idx: 14, text: "with ultraviolet light and three-D LiDAR." }
  - { seg_id: "N05", first_word_idx: 15, last_word_idx: 23, text: "They're training instruments to spot life without touching it." }
  # N06 (26 words: 0..25; word 9 is "in 2024")
  - { seg_id: "N06", first_word_idx: 0, last_word_idx: 2, text: "Why practice underground?" }
  - { seg_id: "N06", first_word_idx: 3, last_word_idx: 7, text: "Radiation sterilizes Mars's open surface—" }
  - { seg_id: "N06", first_word_idx: 8, last_word_idx: 12, text: "yet in 2024, orbital radar confirmed" }
  - { seg_id: "N06", first_word_idx: 13, last_word_idx: 19, text: "an accessible lava-tube cave beneath the Moon." }
  - { seg_id: "N06", first_word_idx: 20, last_word_idx: 25, text: "Deep volcanic pits dot Mars too." }
  # N07 (17 words: 0..16)
  - { seg_id: "N07", first_word_idx: 0, last_word_idx: 7, text: "Of course, finding rock-eating microbes in Earth's caves" }
  - { seg_id: "N07", first_word_idx: 8, last_word_idx: 16, text: "doesn't prove life exists inside Martian or lunar tunnels." }
  # N08 (18 words: 0..17)
  - { seg_id: "N08", first_word_idx: 0, last_word_idx: 4, text: "Cave gold isn't buried treasure." }
  - { seg_id: "N08", first_word_idx: 5, last_word_idx: 9, text: "It's a living microbial reflector—" }
  - { seg_id: "N08", first_word_idx: 10, last_word_idx: 17, text: "turning dark volcanic rock into shelter for life." }

