narration_segments:
  - seg_id: "N01"
    text: "Deep inside sealed volcanic lava tubes, NASA scientists shine their headlamps upward. Bare black rock suddenly glitters like solid gold."
    rate: "+3%"
    pitch: "+0Hz"
    pause_after_s: 0.24
  - seg_id: "N02"
    text: "Explorers are forbidden from touching it, because a single fingerprint destroys decades of growth. Up close, that metallic sheen contains zero gold."
    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.26
  - seg_id: "N03"
    text: "It's a paper-thin mat of extremophile bacteria living in total darkness without sunlight. They pull chemical energy straight out of iron and manganese in rock."
    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.26
  - seg_id: "N04"
    text: "To avoid drowning in cave moisture, the colony weaves a microscopic water-repellent fuzz. Millions of beaded droplets act like tiny lenses—bouncing headlamp beams back as gold."
    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.28
  - seg_id: "N05"
    text: "Wearing sterile gloves, NASA teams scan these fragile walls with ultraviolet light and three-D LiDAR. They're training instruments to spot life without touching it."
    rate: "+2%"
    pitch: "+1Hz"
    pause_after_s: 0.26
  - seg_id: "N06"
    text: "Why practice underground? Radiation sterilizes Mars's open surface—yet in 2024, orbital radar confirmed an accessible lava-tube cave beneath the Moon. Deep volcanic pits dot Mars too."
    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.26
  - seg_id: "N07"
    text: "Of course, finding rock-eating microbes in Earth's caves doesn't prove life exists inside Martian or lunar tunnels."
    rate: "-2%"
    pitch: "-1Hz"
    pause_after_s: 0.28
  - seg_id: "N08"
    text: "Cave gold isn't buried treasure. It's a living microbial reflector—turning dark volcanic rock into shelter for life."
    rate: "-1%"
