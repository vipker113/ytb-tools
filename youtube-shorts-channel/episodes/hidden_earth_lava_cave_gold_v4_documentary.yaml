factual_references:
  - citation: "Northup, D. E., Melim, L. A., Spilde, M. N., Hathaway, J. J. M., et al. (2011). Lava Cave Microbial Communities Within Mats and Secondary Mineral Deposits: Implications for Life Detection on Other Planets. Astrobiology, 11(7), 601–618."
    url: "https://www.liebertpub.com/doi/10.1089/ast.2010.0562"
    doi: "10.1089/ast.2010.0562"
    supported_claims: "Golden, yellow, tan, and white chemolithotrophic microbial mats (including Actinobacteria) coating dark volcanic lava tube walls in Hawaiʻi and North America; mineral oxidation in total darkness; planetary biosignature analog significance."

  - citation: "Lavoie, K. H., Winter, A. S., Read, K. J. H., Hughes, E. M., Spilde, M. N., & Northup, D. E. (2017). Comparison of bacterial communities from lava cave microbial mats to overlying surface soils from Lava Beds National Monument, USA. PLOS ONE, 12(2), e0169339."
    url: "https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0169339"
    doi: "10.1371/journal.pone.0169339"
    supported_claims: "Distinct subsurface Actinobacteria and Proteobacteria biofilms thriving inside Lava Beds National Monument volcanic caves; water-repellent (hydrophobic) surface droplets and fragility to human contact."

  - citation: "U.S. National Park Service — Golden Dome Cave, Lava Beds National Monument Official Geological & Ecological Guide."
    url: "https://www.nps.gov/places/golden-dome-cave.htm"
    supported_claims: "'Cave gold' metallic sheen caused by headlamp light reflecting off water droplets beaded on hydrophobic bacteria; strict do-not-touch conservation rule because damage takes decades to recover."

  - citation: "Carrer, L., Pozzobon, R., Sauro, F., Castelletti, D., Patterson, G. W., & Bruzzone, L. (2024). Radar evidence of an accessible cave conduit on the Moon below the Mare Tranquillitatis pit. Nature Astronomy, 8, 1119–1126."
    url: "https://www.nature.com/articles/s41550-024-02302-y"
    doi: "10.1038/s41550-024-02302-y"
    supported_claims: "2024 orbital radar confirmation of an accessible subsurface volcanic lava-tube cave conduit beneath the Mare Tranquillitatis pit on the Moon, shielded from surface radiation."
