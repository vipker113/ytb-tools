narration_segments:
  - seg_id: "N01"
    text: "In East Antarctica, crimson water pours straight out of solid white glacier ice. Even at minus seventeen degrees Celsius, the flow never freezes."
    delivery: "MYSTERIOUS"
    emotional_tone: "curious_restraint"
    pace: "SLOW"
    energy: 2
    pause_after_s: 0.38
    emphasis_words: ["crimson", "minus seventeen"]
    narrative_beat: "opening_hook"
    viewer_question: "Why is red liquid water pouring out of subzero Antarctic ice?"
    new_information: "A subzero crimson outflow emerges unfrozen from Taylor Glacier."

  - seg_id: "N02"
    text: "In 1911, early explorers blamed red surface algae. Chemical sampling decades later ruled algae out completely and pointed to dissolved iron."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "confident_clarity"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.40
    emphasis_words: ["1911", "iron"]
    narrative_beat: "curiosity_gap"
    viewer_question: "Where does dissolved iron come from inside frozen ice?"
    new_information: "Water chemistry disproved the surface-algae hypothesis."

  - seg_id: "N03"
    text: "Ice-penetrating radar traced the brine to hypersaline seawater trapped four hundred meters underground. High salt content lowers its freezing point, and dissolved iron rusts red when it meets air."
    delivery: "SURPRISED_BUT_CONTROLLED"
    emotional_tone: "controlled_discovery"
    pace: "NATURAL"
    energy: 4
    pause_before_s: 0.14
    pause_after_s: 0.42
    emphasis_words: ["radar", "four hundred", "rusts red"]
    narrative_beat: "payoff"
    viewer_question: "How does the underground brine stay liquid and turn red?"
    new_information: "Extreme salinity keeps the 400-meter-deep brine liquid until iron oxidizes in air."

  - seg_id: "N04"
    text: "Researchers are still studying how completely sealed those deep microbes remain, yet they survive in total darkness without oxygen."
    delivery: "EMOTIONAL_REFLECTION"
    emotional_tone: "credible_reflection"
    pace: "SLOW"
    energy: 2
    pause_after_s: 0.42
    emphasis_words: ["still studying", "darkness"]
    narrative_beat: "final_impression"
    viewer_question: "What remains under scientific investigation?"
    new_information: "Exact hydrological isolation remains under active study while chemosynthetic life persists."

