  - { seg_id: "N02", first_word_idx: 29, last_word_idx: 31, text: "where is everybody?" }
  # N03 (28 words: 0..27)
  - { seg_id: "N03", first_word_idx: 0, last_word_idx: 5, text: "Since nineteen sixty, giant radio dishes" }
  - { seg_id: "N03", first_word_idx: 6, last_word_idx: 10, text: "and optical telescopes have scanned" }
  - { seg_id: "N03", first_word_idx: 11, last_word_idx: 15, text: "thousands of nearby star systems." }
  - { seg_id: "N03", first_word_idx: 16, last_word_idx: 22, text: "Across more than sixty years of listening," }
  - { seg_id: "N03", first_word_idx: 23, last_word_idx: 27, text: "confirmed alien signals equal zero." }
  # N04 (28 words: 0..27)
  - { seg_id: "N04", first_word_idx: 0, last_word_idx: 7, text: "To explain why alien life feels so rare," }
  - { seg_id: "N04", first_word_idx: 8, last_word_idx: 13, text: "Robin Hanson proposed the Great Filter." }
  - { seg_id: "N04", first_word_idx: 14, last_word_idx: 19, text: "Between dead rock and starflight sits" }
  - { seg_id: "N04", first_word_idx: 20, last_word_idx: 27, text: "at least one brutal barrier almost nothing survives." }
  # N05 (30 words: 0..29)
  - { seg_id: "N05", first_word_idx: 0, last_word_idx: 5, text: "If that filter lies behind us," }
  - { seg_id: "N05", first_word_idx: 6, last_word_idx: 11, text: "we already hit the cosmic jackpot." }
  - { seg_id: "N05", first_word_idx: 12, last_word_idx: 17, text: "On early Earth, simple microbes stalled" }
  - { seg_id: "N05", first_word_idx: 18, last_word_idx: 22, text: "for nearly two billion years" }
  - { seg_id: "N05", first_word_idx: 23, last_word_idx: 29, text: "before two cells merged into complex life." }
  # N06 (28 words: 0..27)
  - { seg_id: "N06", first_word_idx: 0, last_word_idx: 9, text: "The darker option puts the Great Filter ahead of us." }
  - { seg_id: "N06", first_word_idx: 10, last_word_idx: 16, text: "Perhaps rocky worlds sprout intelligent species often—" }
  - { seg_id: "N06", first_word_idx: 17, last_word_idx: 21, text: "only to wipe themselves out" }
  - { seg_id: "N06", first_word_idx: 22, last_word_idx: 27, text: "once nuclear or climate tech arrives." }
  # N07 (20 words: 0..19)
  - { seg_id: "N07", first_word_idx: 0, last_word_idx: 6, text: "Still, radio silence doesn't prove we're alone:" }
  - { seg_id: "N07", first_word_idx: 7, last_word_idx: 13, text: "astronomers calculate our searches have sampled barely" }
  - { seg_id: "N07", first_word_idx: 14, last_word_idx: 19, text: "a glass from the cosmic ocean." }
  # N08 (24 words: 0..23)
  - { seg_id: "N08", first_word_idx: 0, last_word_idx: 5, text: "Until one signal breaks the quiet," }
  - { seg_id: "N08", first_word_idx: 6, last_word_idx: 12, text: "Earth remains the only voice we know." }
  - { seg_id: "N08", first_word_idx: 13, last_word_idx: 18, text: "Tonight, our telescopes keep listening across" }
  - { seg_id: "N08", first_word_idx: 19, last_word_idx: 23, text: "three hundred million silent worlds." }

