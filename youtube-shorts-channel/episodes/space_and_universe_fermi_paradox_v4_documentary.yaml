factual_references:
  - citation: "Bryson, S., Kunimoto, M., Kopparapu, R. K., Coughlin, J. L., Borucki, W. J., et al. (2021). The Occurrence of Rocky Habitable-Zone Planets around Solar-Like Stars from Kepler Data. The Astronomical Journal, 161(1), 36."
    url: "https://iopscience.iop.org/article/10.3847/1538-3881/abc418"
    doi: "10.3847/1538-3881/abc418"
    supported_claims: "NASA Kepler occurrence-rate analysis showing sun-like stars commonly host rocky habitable-zone exoplanets (~300 million+ potentially habitable rocky worlds across the Milky Way)."

  - citation: "Hart, M. H. (1975). An Explanation for the Absence of Extraterrestrials on Earth. Quarterly Journal of the Royal Astronomical Society, 16, 128–135; & Jones, E. M. (1985). 'Where is everybody?' An account of Fermi's question. Los Alamos National Laboratory Report LA-10311-MS."
    url: "https://fas.org/irp/agency/dod/jason/fermi.pdf"
    supported_claims: "Enrico Fermi's 1950 Los Alamos question ('Where is everybody?') and galactic crossing timescales (~10 million years even at sub-relativistic ~1% c starflight speeds); zero confirmed extraterrestrial signals since Project Ozma in 1960."

  - citation: "Hanson, R. (1998). The Great Filter — Are We Almost Past It? George Mason University / Future of Humanity Research Paper."
    url: "https://mason.gmu.edu/~rhanson/greatfilter.html"
    supported_claims: "The Great Filter framework: an extreme evolutionary or technological barrier between dead matter and galaxy-spanning civilization, located either behind us (e.g., Earth's ~2-billion-year prokaryote-to-eukaryote transition) or ahead of us (technological self-destruction)."

  - citation: "Wright, J. T., Kanodia, S., & Lubar, E. (2018). How Much SETI Has Been Done? Finding Needles in the n-Dimensional Cosmic Haystack. The Astronomical Journal, 156(6), 260."
    url: "https://iopscience.iop.org/article/10.3847/1538-3881/aae099"
    doi: "10.3847/1538-3881/aae099"
    supported_claims: "Quantitative nine-dimensional SETI search-volume calculation demonstrating that all radio/optical SETI surveys to date have sampled only a minute fraction (comparable to a glass/hot-tub of water out of Earth's oceans), meaning silence does not prove we are alone."
