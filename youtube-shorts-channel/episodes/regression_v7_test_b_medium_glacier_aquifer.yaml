  min_real_evidence_ratio: 0.85

narration_segments:
  - seg_id: "N01"
    text: "Twenty meters beneath Greenland's frozen surface, trillions of liters of liquid water never freeze. Across thousands of square kilometers, a hidden reservoir flows inside solid polar ice."
    delivery: "MYSTERIOUS"
    emotional_tone: "curious_restraint"
    pace: "SLOW"
    energy: 2
    pause_after_s: 0.44
    emphasis_words: ["Twenty meters", "never freeze"]
    narrative_beat: "opening_hook"
    viewer_question: "How can liquid water survive inside subzero Greenland ice?"
    new_information: "A vast perennial liquid aquifer spans thousands of square kilometers inside Greenland's ice sheet."

  - seg_id: "N02"
    text: "Even through minus thirty degree winter nights, this buried water stays liquid inside porous snow. Until 2011, ice models assumed summer meltwater simply refroze near the surface."
    delivery: "CALM_EXPLORATION"
    emotional_tone: "immersive_inquiry"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.42
    emphasis_words: ["minus thirty", "2011"]
    narrative_beat: "curiosity_gap"
    viewer_question: "Why did climate models miss this underground water?"
    new_information: "Prior to 2011 core drilling, models assumed summer meltwater refroze in winter."

  - seg_id: "N03"
    text: "While drilling cores near Helheim Glacier, field teams pulled up dripping wet snow from twenty meters down. Heavy autumn snowfall acts like an insulating blanket, sealing summer warmth inside."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "confident_explanation"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.44
    emphasis_words: ["Helheim Glacier", "insulating blanket"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "What physical mechanism keeps the aquifer from freezing?"
    new_information: "Thick autumn snow insulates the porous firn layer from bitter winter air."

  - seg_id: "N04"
    text: "Airborne radar flights and ground sensors then uncovered a deeper surprise. That buried water does not stay locked in place. It drains downward through deep crevasses toward the glacier bed."
    delivery: "SURPRISED_BUT_CONTROLLED"
    emotional_tone: "controlled_discovery"
    pace: "NATURAL"
    energy: 4
    pause_before_s: 0.16
    pause_after_s: 0.46
    emphasis_words: ["radar", "crevasses", "glacier bed"]
    narrative_beat: "escalation"
    viewer_question: "Where does all of that hidden glacier water go?"
    new_information: "Deep crevasse fractures route aquifer water downward to the bedrock."

  - seg_id: "N05"
    text: "At the bedrock, pressurized water lubricates the ice base and speeds glacier motion toward dark coastal fjords. Freshwater plumes then rise from hundreds of meters below the sea surface."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "measured_gravity"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.44
    emphasis_words: ["lubricates", "coastal fjords"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "What happens when aquifer water reaches the base of the glacier?"
    new_information: "Basal water lubricates ice sliding and injects buoyant freshwater plumes into deep fjords."

  - seg_id: "N06"
    text: "When mineral-rich meltwater enters the North Atlantic, ocean expeditions track how it stirs surface nutrients above the deep twilight zone. Hidden glacier plumbing shapes marine food webs miles offshore."
    delivery: "CINEMATIC_REVEAL"
    emotional_tone: "earned_significance"
    pace: "SLOW"
    energy: 4
    pause_after_s: 0.46
    emphasis_words: ["North Atlantic", "twilight zone"]
    narrative_beat: "payoff"
    viewer_question: "How does subglacial drainage affect open-ocean life?"
    new_information: "Glacial meltwater plumes deliver iron and silica nutrients above the ocean twilight zone."

  - seg_id: "N07"
    text: "Glaciologists are still studying how fast these aquifers drain into the sea, so long-term sea-level forecasts remain an open question. Beneath solid white ice, a dark river keeps moving."
    delivery: "EMOTIONAL_REFLECTION"
    emotional_tone: "reflective_resonance"
    pace: "SLOW"
    energy: 2
    pause_after_s: 0.45
    emphasis_words: ["still studying", "open question"]
    narrative_beat: "final_impression"
    viewer_question: "What remains unresolved for future sea-level projections?"
    new_information: "Exact aquifer drainage rates into the ocean remain an active research question."

