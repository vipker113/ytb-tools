factual_references:
  - citation: "Purkis, S. J., Shernisky, H., Swart, P. K., et al. (2022). Discovery of the deep-sea NEOM Brine Pools in the Gulf of Aqaba, Red Sea. Communications Earth & Environment, 3, 146."
    url: "https://www.nature.com/articles/s43247-022-00482-x"
    doi: "10.1038/s43247-022-00482-x"
    supported_claims: "Discovery of intact NEOM Brine Pools at 1,770 m depth in the Red Sea; hypersaline zero-oxygen brine below a sharp pycnocline; stunned rim fauna; >1,000-year undisturbed earthquake, flood, and tsunami sediment record; astrobiological analog context."

  - citation: "NOAA Office of Ocean Exploration and Research — Deep-Sea Cold Seeps, Salt Domes & Gulf of Mexico Brine Pools Fact Sheets & Expedition Logs."
    url: "https://oceanexplorer.noaa.gov/facts/cold-seeps.html"
    supported_claims: "Subsurface ancient salt dissolution forming hypersaline brine up to 8x saltier than normal seawater; trapped methane and sulfur compounds; chemosynthetic mussel and tubeworm beds thriving along the rim without sunlight."

  - citation: "Sawyer, D. E., Mason, R. A., Cook, A. E., & Portnov, A. (2019). Submarine landslides induce massive waves in subsea brine pools. Scientific Reports, 9, 128."
    url: "https://www.nature.com/articles/s41598-018-36781-7"
    doi: "10.1038/s41598-018-36781-7"
    supported_claims: "Extreme salinity and density stratification (~1.21 g/cm³) creating sharp internal wave interfaces and anoxic preservation in Gulf of Mexico seafloor brine basins."
