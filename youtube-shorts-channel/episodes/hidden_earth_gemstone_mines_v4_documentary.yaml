    last_word_idx: 23
    text: "they hit sticky wet clay."

  - seg_id: "N03"
    first_word_idx: 0
    last_word_idx: 3
    text: "Millions of years ago,"
  - seg_id: "N03"
    first_word_idx: 4
    last_word_idx: 7
    text: "superheated mineral fluids cooled"
  - seg_id: "N03"
    first_word_idx: 8
    last_word_idx: 11
    text: "inside sealed granite cavities."
  - seg_id: "N03"
    first_word_idx: 12
    last_word_idx: 17
    text: "Thick pocket clay cushioned razor-sharp emeralds,"
  - seg_id: "N03"
    first_word_idx: 18
    last_word_idx: 23
    text: "tourmaline, and fluorite as they grew."

  - seg_id: "N04"
    first_word_idx: 0
    last_word_idx: 7
    text: "Only after miners rinse away that grey mud"
  - seg_id: "N04"
    first_word_idx: 8
    last_word_idx: 14
    text: "do raw crystal faces flash with color."
  - seg_id: "N04"
    first_word_idx: 15
    last_word_idx: 20
    text: "Yet above ground, jewelers slice out"
  - seg_id: "N04"
    first_word_idx: 21
    last_word_idx: 25
    text: "cloudy specks as worthless flaws."

  - seg_id: "N05"
    first_word_idx: 0
    last_word_idx: 2
    text: "To deep-Earth geologists,"
  - seg_id: "N05"
    first_word_idx: 3
    last_word_idx: 7
    text: "those rejected flaws are priceless."
  - seg_id: "N05"
    first_word_idx: 8
    last_word_idx: 13
    text: "Some rough diamonds blast upward"
  - seg_id: "N05"
    first_word_idx: 14
    last_word_idx: 18
    text: "through volcanic pipes from more"
  - seg_id: "N05"
    first_word_idx: 19
    last_word_idx: 22
    text: "than 600 kilometers down."

  - seg_id: "N06"
    first_word_idx: 0
    last_word_idx: 5
    text: "Firing X-ray beams into flawed diamonds,"
  - seg_id: "N06"
    first_word_idx: 6
    last_word_idx: 8
    text: "scientists found ringwoodite—"
  - seg_id: "N06"
    first_word_idx: 9
    last_word_idx: 14
    text: "a deep mineral locking away water."
  - seg_id: "N06"
    first_word_idx: 15
    last_word_idx: 21
    text: "In 2018, diamonds even revealed Ice-Seven:"
  - seg_id: "N06"
    first_word_idx: 22
    last_word_idx: 25
    text: "solid high-pressure water ice."

  - seg_id: "N07"
    first_word_idx: 0
    last_word_idx: 6
    text: "That doesn't mean an open underground ocean"
  - seg_id: "N07"
    first_word_idx: 7
    last_word_idx: 10
    text: "sloshes beneath Earth's crust."
  - seg_id: "N07"
    first_word_idx: 11
    last_word_idx: 17
    text: "Most of that deep water stays trapped"
  - seg_id: "N07"
    first_word_idx: 18
    last_word_idx: 24
    text: "inside crystal rock and microscopic fluid pockets."

  - seg_id: "N08"
    first_word_idx: 0
    last_word_idx: 6
    text: "Jewelers polish away tiny inclusions for sparkle."
  - seg_id: "N08"
    first_word_idx: 7
    last_word_idx: 12
    text: "Scientists read those same crystal traps"
  - seg_id: "N08"
    first_word_idx: 13
    last_word_idx: 15
    text: "as time capsules—"
  - seg_id: "N08"
    first_word_idx: 16
    last_word_idx: 21
    text: "carried up through solid mine rock."

