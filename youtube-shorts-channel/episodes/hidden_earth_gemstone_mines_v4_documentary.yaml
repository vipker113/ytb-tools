factual_references:
  - citation: "London, D. (2008). Pegmatites. The Canadian Mineralogist Special Publication 10, Mineralogical Association of Canada."
    url: "https://www.mineralogicalassociation.ca/"
    supported_claims: "Granitic pegmatite fractional crystallization concentrating H2O, boron, lithium, and beryllium into sealed miarolitic cavities ('gem pockets') lined with hydrothermal clays (kaolinite/smectite) hosting euhedral tourmaline, beryl/emerald, fluorite, and quartz."

  - citation: "Pearson, D. G., Brenker, F. E., Nestola, F., McNeill, J., Nasdala, L., Hutchison, M. T., Matveev, S., Mather, K., Silversmit, G., Schmitz, S., Vekemans, B., & Vincze, L. (2014). Hydrous mantle transition zone indicated by ringwoodite included within diamond. Nature, 507, 221–224."
    url: "https://www.nature.com/articles/nature13080"
    doi: "10.1038/nature13080"
    supported_claims: "Discovery of terrestrial hydrous ringwoodite (~1.4–1.5 wt% water) sealed inside a super-deep rough diamond from Juína, Brazil, demonstrating water-rich regions in Earth's 410–660 km mantle transition zone."

  - citation: "Tschauner, O., Huang, S., Greenberg, E., Prakapenka, V. B., Ma, C., Rossman, G. R., Shen, A. H., Zhang, D., Newville, M., Lanzirotti, A., & Tait, K. (2018). Ice-VII inclusions in diamonds: Evidence for aqueous fluid in Earth's deep mantle. Science, 359(6380), 1136–1139."
    url: "https://www.science.org/doi/10.1126/science.aao3030"
    doi: "10.1126/science.aao3030"
    supported_claims: "Synchrotron X-ray diffraction identification of natural solid high-pressure cubic water ice (Ice-VII) preserved at gigapascal residual pressures inside deep-mantle diamonds from 410–800 km depth."

  - citation: "Shigley, J. E., Laurs, B. M., Janse, A. J. A., Elen, S., & Dirlam, D. M. (2000–2023). Gem Localities & Inclusion Research, Gems & Gemology, Gemological Institute of America (GIA)."
    url: "https://www.gia.edu/gems-gemology"
    supported_claims: "Contrast between commercial lapidary clarity grading (removing cloudy fluid and mineral inclusions) and geological research using diamond/corundum/beryl inclusions to reconstruct mantle and crustal formation conditions."
