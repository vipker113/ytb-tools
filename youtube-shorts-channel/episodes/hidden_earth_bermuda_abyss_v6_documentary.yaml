  - citation: "NOAA National Ocean Service — What is the Bermuda Triangle? & Puerto Rico Trench Bathymetry (Milwaukee Deep ~8,376 m)."
    url: "https://oceanservice.noaa.gov/facts/bermudatri.html"
    supported_claims: "No evidence that mysterious disappearances occur with greater frequency in the Bermuda Triangle than in any other large, well-traveled area of the ocean; Gulf Stream rapid weather/wave changes; deep trenches including the Puerto Rico Trench."
  - citation: "U.S. Geological Survey (USGS) — Gas Hydrates and the Bermuda Triangle Myth."
    url: "https://www.usgs.gov/faqs/what-bermuda-triangle"
    supported_claims: "USGS gas-hydrate research shows no large methane-hydrate releases have occurred in the Bermuda Triangle / Blake Ridge region for roughly the past 15,000 years."
  - citation: "Frazer, W. D., Park, J., & Olugboji, T. — Seismic receiver-function imaging of a ~20-km-thick low-density underplated rock layer beneath Bermuda supporting the ~500-m Bermuda Swell."
    url: "https://agupubs.onlinelibrary.wiley.com/journal/19448007"
    supported_claims: "Identification of an unusual ~20-kilometer-thick underplated rock layer beneath Bermuda's oceanic crust whose buoyancy holds the surrounding Bermuda seafloor swell ~500 meters higher than expected without an active hot-spot plume."
  - citation: "NOAA Ocean Exploration — Identification of the Wreck of SS Cotopaxi off St. Augustine, Florida (2020)."
    url: "https://oceanexplorer.noaa.gov/"
    supported_claims: "SS Cotopaxi vanished on a voyage from Charleston to Havana in December 1925 during a severe Atlantic storm and was positively identified underwater ~35 nautical miles off St. Augustine, Florida."
