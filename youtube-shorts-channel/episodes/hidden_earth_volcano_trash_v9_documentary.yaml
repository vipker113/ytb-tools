factual_references:
  - citation: "Patrick, M. R., Orr, T., Sutton, A. J., Lev, E., Thelen, W., & Fee, D. (2015). Spattering triggered by rockfalls at Kīlauea Volcano, Hawaiʻi. Geology, 43(9), 835–838; and USGS Volcano Hazards Program — Volcano Lava & Gas Fact Sheets."
    url: "https://doi.org/10.1130/G36896.1"
    supported_claims: "Basaltic lava lakes erupt at ~1,100–1,200°C (below the ~1,370–1,540°C melting range of carbon/stainless steels), maintain cooled surface crusts over gas-charged magma that violently fountain when punctured by cold foreign masses (as in the documented 2002 30-kg camp-waste drop at Ethiopia's Erta Ale), and vent massive unfiltered plumes of sulfur dioxide and acidic volcanic gases from upward-pressurized conduits."
