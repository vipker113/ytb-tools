factual_references:
- citation: NASA History Division / Smithsonian National Air and Space Museum — Project Mercury Navy Mark IV Pressure Suit
    (1961) & Project Gemini G4C Extravehicular Suit (Ed White, Gemini IV, June 3, 1965).
  url: https://www.nasa.gov/spacesuits/
  supported_claims: Mercury's silver aluminized-nylon Mark IV suit served strictly as unpressurized cabin backup and stiffened
    when inflated; Ed White spacewalked on a 25-foot gold-wrapped umbilical using a handheld gas maneuvering gun while pressurized
    soft Gemini suits ballooned stiff.
- citation: NASA Johnson Space Center — Apollo A7L / A7LB Lunar Extravehicular Mobility Unit (21 layers, Beta-cloth, Mylar/ballistic
    micrometeoroid defense, LEVA gold visor, LCVG water-cooling garment & PLSS).
  url: https://www.nasa.gov/history/alsj/
  supported_claims: Apollo suits combined 21 thermal and ballistic layers to stop ~28,000 km/h micrometeoroids, gold-plated
    visors, and chilled-water LCVG tubes, while pressurized fabric torsos restricted bending and contributed to lunar falls.
- citation: NASA Johnson Space Center — Space Shuttle Hard Upper Torso EMU & Manned Maneuvering Unit (STS-41B, Bruce McCandless,
    Feb 7, 1984, 24 nitrogen thrusters, ~100 m untethered) and Artemis Next-Generation Lunar Spacesuits (rear-entry hatch,
    rotary bearings & lunar regolith dust mitigation, 2026).
  url: https://www.nasa.gov/humans-in-space/spacesuits/
  supported_claims: Shuttle EMUs introduced a rigid fiberglass Hard Upper Torso and paired with the 24-thruster nitrogen MMU
    for McCandless's 100-meter untethered flight; Artemis generation suits add a rear-entry hatch, sealed rotary metal bearings,
    and dust-tolerant seals for Lunar South Pole craters.
