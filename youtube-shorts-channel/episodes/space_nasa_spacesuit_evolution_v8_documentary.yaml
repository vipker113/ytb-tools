youtube_description: 'In 1961, America''s first spacesuit—the Project Mercury Navy Mark IV—was a gleaming aluminized-nylon
  backup cocoon. If cabin pressure ever failed in vacuum, the suit ballooned so stiff that an astronaut could barely bend
  an elbow.


  Over 65 years, NASA spacesuit hardware evolved from soft fabric bladders into standalone, joint-bearing human spacecraft:

  • 1961 (Mercury Mark IV): Mirror-bright aluminized nylon over a neoprene pressure bladder, worn strictly as unpressurized
  cabin backup inside cramped capsules.

  • 1965 (Gemini G4C): First American spacewalk suit tethered to a 25-foot golden umbilical hose as Ed White fired a handheld
  gas gun—though internal pressure inflated soft suits rigid like car tires.

  • 1969–1972 (Apollo A7L / A7LB): A 21-layer wearable spacecraft combining fireproof white Beta-cloth, alternating Mylar
  insulation, ballistic micrometeoroid armor (28,000 km/h impact defense), gold-plated solar visors, and chilled-water cooling
  tubes—yet stiff fabric torsos still forced astronauts to bunny-hop and topple when reaching for rocks.

  • 1984 (Space Shuttle EMU + MMU): Two-piece modular suit built around a rigid fiberglass Hard Upper Torso, snapped onto
  the 24-thruster nitrogen Manned Maneuvering Unit as Bruce McCandless flew untethered 100 meters from Challenger.

  • 2026 (NASA Artemis Next-Generation Lunar Suit): Sealed rotary metal bearings at the waist, hips, and knees paired with
  a rear-entry backpack hatch—engineered to kneel across craters while defending joints against glass-sharp lunar dust at
  the Moon''s South Pole.


  Footage & Photography: Public Domain — NASA Johnson Space Center, Kennedy Space Center, Glenn Research Center & Wikimedia
  Commons.

  '
