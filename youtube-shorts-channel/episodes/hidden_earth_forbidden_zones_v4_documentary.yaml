caption_groups:
  - seg_id: "N01"
    first_word_idx: 0
    last_word_idx: 4
    text: "Every forbidden zone on Earth"
  - seg_id: "N01"
    first_word_idx: 5
    last_word_idx: 12
    text: "looks like a warning built to save you."
  - seg_id: "N01"
    first_word_idx: 13
    last_word_idx: 17
    text: "Step inside three locked-off places,"
  - seg_id: "N01"
    first_word_idx: 18
    last_word_idx: 23
    text: "and the real danger flips completely."

  - seg_id: "N02"
    first_word_idx: 0
    last_word_idx: 3
    text: "Around Chernobyl's shattered reactor,"
  - seg_id: "N02"
    first_word_idx: 4
    last_word_idx: 8
    text: "a giant exclusion zone still"
  - seg_id: "N02"
    first_word_idx: 9
    last_word_idx: 12
    text: "bars normal human life."
  - seg_id: "N02"
    first_word_idx: 13
    last_word_idx: 19
    text: "Radiation there burned whole pine stands rust-red,"
  - seg_id: "N02"
    first_word_idx: 20
    last_word_idx: 26
    text: "creating what workers named the Red Forest."

  - seg_id: "N03"
    first_word_idx: 0
    last_word_idx: 3
    text: "Yet once people vanished,"
  - seg_id: "N03"
    first_word_idx: 4
    last_word_idx: 6
    text: "wildlife surged back."
  - seg_id: "N03"
    first_word_idx: 7
    last_word_idx: 12
    text: "Gray wolves, wild horses, and deer"
  - seg_id: "N03"
    first_word_idx: 13
    last_word_idx: 16
    text: "multiplied across empty towns"
  - seg_id: "N03"
    first_word_idx: 17
    last_word_idx: 21
    text: "faster than in nearby reserves."

  - seg_id: "N04"
    first_word_idx: 0
    last_word_idx: 4
    text: "Even stranger, robots probing inside"
  - seg_id: "N04"
    first_word_idx: 5
    last_word_idx: 10
    text: "the reactor walls found pitch-black fungi"
  - seg_id: "N04"
    first_word_idx: 11
    last_word_idx: 13
    text: "growing toward radiation."
  - seg_id: "N04"
    first_word_idx: 14
    last_word_idx: 18
    text: "Packed with dark melanin pigment,"
  - seg_id: "N04"
    first_word_idx: 19
    last_word_idx: 26
    text: "those fungi harvest lethal gamma rays for energy."

  - seg_id: "N05"
    first_word_idx: 0
    last_word_idx: 4
    text: "In southwestern France, Lascaux Cave"
  - seg_id: "N05"
    first_word_idx: 5
    last_word_idx: 11
    text: "is locked for the exact opposite reason."
  - seg_id: "N05"
    first_word_idx: 12
    last_word_idx: 17
    text: "Humans aren't banned to save visitors—"
  - seg_id: "N05"
    first_word_idx: 18
    last_word_idx: 21
    text: "we are the poison."

  - seg_id: "N06"
    first_word_idx: 0
    last_word_idx: 3
    text: "For 17,000 years,"
  - seg_id: "N06"
    first_word_idx: 4
    last_word_idx: 8
    text: "prehistoric animal paintings survived inside"
  - seg_id: "N06"
    first_word_idx: 9
    last_word_idx: 12
    text: "cool, sealed limestone air."
  - seg_id: "N06"
    first_word_idx: 13
    last_word_idx: 18
    text: "When crowds poured in, human breath,"
  - seg_id: "N06"
    first_word_idx: 19
    last_word_idx: 23
    text: "body heat, and shoe spores"
  - seg_id: "N06"
    first_word_idx: 24
    last_word_idx: 30
    text: "triggered white mold that ate the art."
  - seg_id: "N06"
    first_word_idx: 31
    last_word_idx: 36
    text: "France sealed the real cave forever"
  - seg_id: "N06"
    first_word_idx: 37
    last_word_idx: 42
    text: "and built an exact copy nearby."

  - seg_id: "N07"
    first_word_idx: 0
    last_word_idx: 4
    text: "Off Iceland's coast, Surtsey Island"
  - seg_id: "N07"
    first_word_idx: 5
    last_word_idx: 11
    text: "bans humans for an even stricter purpose:"
  - seg_id: "N07"
    first_word_idx: 12
    last_word_idx: 13
    text: "pure creation."
  - seg_id: "N07"
    first_word_idx: 14
    last_word_idx: 19
    text: "When an undersea volcano boiled up"
  - seg_id: "N07"
    first_word_idx: 20
    last_word_idx: 22
    text: "in 1963,"
  - seg_id: "N07"
    first_word_idx: 23
    last_word_idx: 28
    text: "scientists quarantined the barren rock immediately."
  - seg_id: "N07"
    first_word_idx: 29
    last_word_idx: 35
    text: "Researchers scrub every seed from their boots—"
  - seg_id: "N07"
    first_word_idx: 36
    last_word_idx: 43
    text: "and when one stray tomato sprouted in ash,"
  - seg_id: "N07"
    first_word_idx: 44
    last_word_idx: 47
    text: "they ripped it out."

  - seg_id: "N08"
    first_word_idx: 0
    last_word_idx: 4
    text: "Carried only by ocean waves"
  - seg_id: "N08"
    first_word_idx: 5
    last_word_idx: 7
    text: "and nesting gulls,"
  - seg_id: "N08"
    first_word_idx: 8
    last_word_idx: 14
    text: "60 plant species turned black lava green."
  - seg_id: "N08"
    first_word_idx: 15
    last_word_idx: 20
    text: "That doesn't mean radiation is harmless,"
  - seg_id: "N08"
    first_word_idx: 21
    last_word_idx: 26
    text: "or that sealed caves ever recover"
  - seg_id: "N08"
    first_word_idx: 27
    last_word_idx: 32
    text: "once human crowds break their balance."

  - seg_id: "N09"
    first_word_idx: 0
    last_word_idx: 5
    text: "Some forbidden zones lock us out"
  - seg_id: "N09"
    first_word_idx: 6
    last_word_idx: 10
    text: "to keep our bodies alive."
  - seg_id: "N09"
    first_word_idx: 11
    last_word_idx: 16
    text: "The rarest ones lock us out"
  - seg_id: "N09"
    first_word_idx: 17
    last_word_idx: 23
    text: "because a single human footprint changes everything."

