primary_title: "3 Forbidden Places Humans Are Banned From—And What Happened Inside"
alternative_title: "Why Humans Are Strictly Locked Out of These 3 Places on Earth"

youtube_description: |
  Every forbidden zone on Earth looks like a warning designed to keep people alive. Look inside three of the planet's strictest off-limits zones, however, and the true reason for the ban flips completely.

  Around Chernobyl's shattered Reactor 4, an exclusion zone still restricts normal human habitation where fallout scorched pine stands into the Red Forest. Yet once human activity vanished, camera traps and aerial surveys revealed gray wolves, Przewalski's wild horses, and elk multiplying at densities matching or exceeding uncontaminated nature reserves (Deryabina et al., Current Biology, 2015)—while robots inside the reactor walls discovered melanin-rich black fungi growing toward gamma radiation and converting ionizing energy into metabolic growth (Dadachova et al., PLOS ONE, 2007).

  In southwestern France, Lascaux Cave is sealed forever for the opposite reason: human breath. Exhaled CO2, body warmth, and shoe-borne spores triggered algae and white Fusarium solani mold across 17,000-year-old Paleolithic paintings (Bastian et al., Microbiology, 2010). Meanwhile off Iceland, volcanic Surtsey Island has barred visitors since erupting from the sea in 1963—forcing permitted scientists to scrub every seed from their boots so biologists could watch ocean waves and nesting gulls build a 60-species ecosystem on barren lava from zero (Magnússon et al., Surtsey Research, 2014).

