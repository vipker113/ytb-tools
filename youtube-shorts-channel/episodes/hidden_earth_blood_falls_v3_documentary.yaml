excluded_sources_notes:
  - "USAP-DC Blood Falls time-lapse & thermal datasets (usap-dc.org/view/dataset/601164 & 601169): Excluded by commercial-rights gate because USAP-DC licenses them under CC BY-NC 4.0 (Non-Commercial), which prohibits monetized YouTube reuse."
  - "PBS Terra ('Why is this Antarctic Glacier Bleeding?'): Excluded because broadcast video is copyrighted by PBS rather than open Public Domain / CC BY."
  - "Internet Archive NSF Science Nation clips (640x360 SD): Excluded by 9:16 crop-feasibility gate (< 540px vertical height)."

factual_references:
  - citation: "Zoumplis, A. et al. (2026). Molecular evidence for a relict marine community in an Antarctic Dry Valleys subglacial brine-fed system. Nature Geoscience, 19, 1105–1114."
    url: "https://www.nature.com/articles/s41561-026-02054-6"
    doi: "10.1038/s41561-026-02054-6"
    supported_claims: "167 regional samples across water, sediment, airborne, and marine reference sites; distinctive marine-related micro-eukaryotic community (diatoms, haptophytes, dinoflagellates, ciliates) around Taylor Glacier terminus; caveat that continuous multi-million-year subglacial survival of exact sampled organisms is not proven."
  - citation: "Yale News (August 4, 2026). Red marks the spot: A network of complex microbes discovered at mysterious Blood Falls."
    url: "https://news.yale.edu/2026/08/04/red-marks-spot-network-complex-microbes-discovered-mysterious-blood-falls"
    supported_claims: "Accessible research summary and context on ongoing investigation into microbial connectivity."
  - citation: "NASA Earth Observatory — Blood Falls, Antarctica's Dry Valleys."
    url: "https://science.nasa.gov/earth/earth-observatory/blood-falls-antarcticas-dry-valleys-35535/"
    supported_claims: "Location at Taylor Glacier terminus in McMurdo Dry Valleys; salty iron-rich brine oxidizing on air contact; hypothesized ancient seawater origin."
  - citation: "National Science Foundation (U.S. Antarctic Program) — Science on the Ice (Fifth Edition)."
    url: "https://nsf-gov-resources.nsf.gov/files/NSF-Science-on-the-Ice-fifth-edition.pdf"
    supported_claims: "U.S. Antarctic Program / McMurdo Dry Valleys LTER scientific field context."
