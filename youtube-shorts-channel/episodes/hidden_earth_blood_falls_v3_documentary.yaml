  - {seg_id: "N01", first_word_idx: 5, last_word_idx: 9, text: "a five-story waterfall pours blood-red"}
  - {seg_id: "N01", first_word_idx: 10, last_word_idx: 15, text: "straight out of solid glacier ice."}
  - {seg_id: "N02", first_word_idx: 0, last_word_idx: 5, text: "For decades, nobody knew what fed"}
  - {seg_id: "N02", first_word_idx: 6, last_word_idx: 9, text: "Taylor Glacier's Blood Falls."}
  - {seg_id: "N02", first_word_idx: 10, last_word_idx: 17, text: "Today, we know the color comes from chemistry:"}
  - {seg_id: "N02", first_word_idx: 18, last_word_idx: 23, text: "salty, iron-rich water hits the air"}
  - {seg_id: "N02", first_word_idx: 24, last_word_idx: 26, text: "and instantly rusts."}
  - {seg_id: "N03", first_word_idx: 0, last_word_idx: 4, text: "Deep under the ice sits"}
  - {seg_id: "N03", first_word_idx: 5, last_word_idx: 10, text: "a trapped reservoir of hyper-salty brine—"}
  - {seg_id: "N03", first_word_idx: 11, last_word_idx: 15, text: "likely ancient seawater sealed off"}
  - {seg_id: "N03", first_word_idx: 16, last_word_idx: 19, text: "as the glacier advanced,"}
  - {seg_id: "N03", first_word_idx: 20, last_word_idx: 26, text: "though its full history remains under investigation."}
  - {seg_id: "N04", first_word_idx: 0, last_word_idx: 3, text: "Rust explains the color."}
  - {seg_id: "N04", first_word_idx: 4, last_word_idx: 7, text: "What surprised researchers in 2026"}
  - {seg_id: "N04", first_word_idx: 8, last_word_idx: 11, text: "was what they pulled"}
  - {seg_id: "N04", first_word_idx: 12, last_word_idx: 16, text: "from the freezing red mud."}
  - {seg_id: "N05", first_word_idx: 0, last_word_idx: 4, text: "Testing 167 ice, sediment, air,"}
  - {seg_id: "N05", first_word_idx: 5, last_word_idx: 10, text: "and ocean samples across the region,"}
  - {seg_id: "N05", first_word_idx: 11, last_word_idx: 17, text: "a field team uncovered a hidden community"}
  - {seg_id: "N05", first_word_idx: 18, last_word_idx: 25, text: "of marine microbes right at the red outflow."}
  - {seg_id: "N06", first_word_idx: 0, last_word_idx: 8, text: "Under the microscope were tiny ocean algae like diatoms,"}
  - {seg_id: "N06", first_word_idx: 9, last_word_idx: 12, text: "alongside single-celled marine drifters—"}
  - {seg_id: "N06", first_word_idx: 13, last_word_idx: 18, text: "living clues of past ocean connections,"}
  - {seg_id: "N06", first_word_idx: 19, last_word_idx: 22, text: "miles from open sea."}
  - {seg_id: "N07", first_word_idx: 0, last_word_idx: 6, text: "Now, that doesn't prove these exact organisms"}
  - {seg_id: "N07", first_word_idx: 7, last_word_idx: 11, text: "stayed trapped beneath the ice"}
  - {seg_id: "N07", first_word_idx: 12, last_word_idx: 15, text: "for millions of years."}
  - {seg_id: "N07", first_word_idx: 16, last_word_idx: 20, text: "Scientists are still piecing together"}
  - {seg_id: "N07", first_word_idx: 21, last_word_idx: 24, text: "how they got there."}
  - {seg_id: "N08", first_word_idx: 0, last_word_idx: 3, text: "Blood Falls isn't bleeding."}
  - {seg_id: "N08", first_word_idx: 4, last_word_idx: 8, text: "It's a leaking subglacial vault—"}
  - {seg_id: "N08", first_word_idx: 9, last_word_idx: 17, text: "showing that even beneath 400 meters of Antarctic ice,"}
  - {seg_id: "N08", first_word_idx: 18, last_word_idx: 23, text: "Earth holds unexpected signs of life."}

