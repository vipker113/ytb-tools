narration_segments:
  - seg_id: "N01"
    text: "In Antarctica's freezing Dry Valleys, a five-story waterfall pours blood-red straight out of solid glacier ice."
    rate: "+3%"
    pitch: "+0Hz"
    pause_after_s: 0.22
  - seg_id: "N02"
    text: "For decades, nobody knew what fed Taylor Glacier's Blood Falls. Today, we know the color comes from chemistry: salty, iron-rich water hits the air and instantly rusts."
    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.26
  - seg_id: "N03"
    text: "Deep under the ice sits a trapped reservoir of hyper-salty brine—likely ancient seawater sealed off as the glacier advanced, though its full history remains under investigation."
    rate: "+0%"
    pitch: "+0Hz"
    pause_after_s: 0.28
  - seg_id: "N04"
    text: "Rust explains the color. What surprised researchers in 2026 was what they pulled from the freezing red mud."
    rate: "+2%"
    pitch: "+1Hz"
    pause_after_s: 0.24
  - seg_id: "N05"
    text: "Testing 167 ice, sediment, air, and ocean samples across the region, a field team uncovered a hidden community of marine microbes right at the red outflow."
    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.25
  - seg_id: "N06"
    text: "Under the microscope were tiny ocean algae like diatoms, alongside single-celled marine drifters—living clues of past ocean connections, miles from open sea."
    rate: "+0%"
    pitch: "+0Hz"
    pause_after_s: 0.28
  - seg_id: "N07"
    text: "Now, that doesn't prove these exact organisms stayed trapped beneath the ice for millions of years. Scientists are still piecing together how they got there."
    rate: "-2%"
    pitch: "-1Hz"
    pause_after_s: 0.28
  - seg_id: "N08"
    text: "Blood Falls isn't bleeding. It's a leaking subglacial vault—showing that even beneath 400 meters of Antarctic ice, Earth holds unexpected signs of life."
    rate: "-1%"
    pitch: "-1Hz"
    pause_after_s: 0.28

