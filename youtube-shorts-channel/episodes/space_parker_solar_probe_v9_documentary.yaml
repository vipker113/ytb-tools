factual_references:
  - citation: "Kasper, J. C., Klein, K. G., Lichko, E., et al. (2021). Parker Solar Probe Enters the Magnetically Dominated Solar Corona. Physical Review Letters, 127(25), 255101."
    url: "https://doi.org/10.1103/PhysRevLett.127.255101"
    supported_claims: "Confirmed humanity's first direct spacecraft entry below the Alfvén critical surface into the magnetically dominated solar corona (>1,000,000°C ultra-tenuous plasma vs ~5,500°C photosphere) and ongoing investigation of magnetic switchbacks and Alfvénic wave heating."
  - citation: "NASA Goddard Space Flight Center & Johns Hopkins Applied Physics Laboratory (Congdon, B. et al., 2018; Dec 2024 Perihelion Fact Sheet). Traveling to the Sun: Why Won't Parker Solar Probe Melt?"
    url: "https://science.nasa.gov/science-research/heliophysics/traveling-to-the-sun-why-wont-parker-solar-probe-melt/"
    supported_claims: "At 3.8 million miles (6.1 million km) closest solar approach, low coronal particle density limits conductive heat transfer while Parker's 4.5-inch (11.4 cm), 97%-void alumina-coated carbon-composite foam Thermal Protection System endures up to ~1,370°C (2,500°F) on its sun-facing side and keeps spacecraft instruments near ~30°C (85°F)."

