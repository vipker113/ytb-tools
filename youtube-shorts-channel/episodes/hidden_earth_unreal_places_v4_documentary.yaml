    rate: "+1%"
    pitch: "+0Hz"
    pause_after_s: 0.28
    emphasis_words: ["zero", "pH", "negative", "microbial", "life"]
  - seg_id: "N06"
    text: "Three hundred meters beneath Naica, Mexico lies an even stranger trap: the Cave of the Crystals. Mineral-rich hot water slowly grew gypsum beams eleven meters long and weighing fifty-five tons."
    rate: "+2%"
    pitch: "+1Hz"
    pause_after_s: 0.28
    emphasis_words: ["Three", "hundred", "Naica", "Crystals", "eleven", "meters", "fifty-five", "tons"]
  - seg_id: "N07"
    text: "Inside, fifty-eight-degree heat meets ninety-five percent humidity—hotter than your own lungs. Without ice suits and chilled air packs, every breath condenses water straight into your airways. That doesn't mean these places break physics—extreme heat and acid simply push chemistry past human limits."
    rate: "-1%"
    pitch: "-1Hz"
    pause_after_s: 0.26
    emphasis_words: ["fifty-eight-degree", "ninety-five", "hotter", "lungs", "condenses", "limits"]
  - seg_id: "N08"
