caption_groups:
  - seg_id: "N01"
    first_word_idx: 0
    last_word_idx: 4
    text: "None of these three places"
  - seg_id: "N01"
    first_word_idx: 5
    last_word_idx: 8
    text: "on Earth are CGI."
  - seg_id: "N01"
    first_word_idx: 9
    last_word_idx: 14
    text: "The last one drowns human lungs"
  - seg_id: "N01"
    first_word_idx: 15
    last_word_idx: 17
    text: "from the inside."

  - seg_id: "N02"
    first_word_idx: 0
    last_word_idx: 3
    text: "At midnight in Indonesia,"
  - seg_id: "N02"
    first_word_idx: 4
    last_word_idx: 7
    text: "Kawah Ijen volcano appears"
  - seg_id: "N02"
    first_word_idx: 8
    last_word_idx: 13
    text: "to pour rivers of electric-blue lava."
  - seg_id: "N02"
    first_word_idx: 14
    last_word_idx: 18
    text: "Except lava is never blue."

  - seg_id: "N03"
    first_word_idx: 0
    last_word_idx: 5
    text: "Pressurized sulfur gas shoots from cracks"
  - seg_id: "N03"
    first_word_idx: 6
    last_word_idx: 10
    text: "at six hundred degrees Celsius"
  - seg_id: "N03"
    first_word_idx: 11
    last_word_idx: 16
    text: "and ignites on contact with air."
  - seg_id: "N03"
    first_word_idx: 17
    last_word_idx: 22
    text: "Some gas condenses into liquid sulfur"
  - seg_id: "N03"
    first_word_idx: 23
    last_word_idx: 27
    text: "that keeps burning bright blue"
  - seg_id: "N03"
    first_word_idx: 28
    last_word_idx: 31
    text: "as it flows downhill."

  - seg_id: "N04"
    first_word_idx: 0
    last_word_idx: 4
    text: "Cross into Ethiopia's Danakil Depression,"
  - seg_id: "N04"
    first_word_idx: 5
    last_word_idx: 10
    text: "and Earth stops looking habitable altogether."
  - seg_id: "N04"
    first_word_idx: 11
    last_word_idx: 15
    text: "At Dallol, shallow volcanic heat"
  - seg_id: "N04"
    first_word_idx: 16
    last_word_idx: 21
    text: "boils groundwater packed with iron salts"
  - seg_id: "N04"
    first_word_idx: 22
    last_word_idx: 24
    text: "and sulfuric acid."

  - seg_id: "N05"
    first_word_idx: 0
    last_word_idx: 6
    text: "Those neon-green pools drop below zero pH"
  - seg_id: "N05"
    first_word_idx: 7
    last_word_idx: 9
    text: "into negative acidity."
  - seg_id: "N05"
    first_word_idx: 10
    last_word_idx: 14
    text: "Even with liquid water everywhere,"
  - seg_id: "N05"
    first_word_idx: 15
    last_word_idx: 17
    text: "biologists found zero"
  - seg_id: "N05"
    first_word_idx: 18
    last_word_idx: 23
    text: "active microbial life inside the ponds."

  - seg_id: "N06"
    first_word_idx: 0
    last_word_idx: 5
    text: "Three hundred meters beneath Naica, Mexico"
  - seg_id: "N06"
    first_word_idx: 6
    last_word_idx: 10
    text: "lies an even stranger trap:"
  - seg_id: "N06"
    first_word_idx: 11
    last_word_idx: 15
    text: "the Cave of the Crystals."
  - seg_id: "N06"
    first_word_idx: 16
    last_word_idx: 20
    text: "Mineral-rich hot water slowly grew"
  - seg_id: "N06"
    first_word_idx: 21
    last_word_idx: 25
    text: "gypsum beams eleven meters long"
  - seg_id: "N06"
    first_word_idx: 26
    last_word_idx: 29
    text: "and weighing fifty-five tons."

  - seg_id: "N07"
    first_word_idx: 0
    last_word_idx: 2
    text: "Inside, fifty-eight-degree heat"
  - seg_id: "N07"
    first_word_idx: 3
    last_word_idx: 6
    text: "meets ninety-five percent humidity—"
  - seg_id: "N07"
    first_word_idx: 7
    last_word_idx: 11
    text: "hotter than your own lungs."
  - seg_id: "N07"
    first_word_idx: 12
    last_word_idx: 18
    text: "Without ice suits and chilled air packs,"
  - seg_id: "N07"
    first_word_idx: 19
    last_word_idx: 22
    text: "every breath condenses water"
  - seg_id: "N07"
    first_word_idx: 23
    last_word_idx: 26
    text: "straight into your airways."
  - seg_id: "N07"
    first_word_idx: 27
    last_word_idx: 33
    text: "That doesn't mean these places break physics—"
  - seg_id: "N07"
    first_word_idx: 34
    last_word_idx: 37
    text: "extreme heat and acid"
  - seg_id: "N07"
    first_word_idx: 38
    last_word_idx: 43
    text: "simply push chemistry past human limits."

  - seg_id: "N08"
    first_word_idx: 0
    last_word_idx: 4
    text: "In twenty seventeen, groundwater flooded"
  - seg_id: "N08"
    first_word_idx: 5
    last_word_idx: 10
    text: "the Naica crystal cave shut forever—"
  - seg_id: "N08"
    first_word_idx: 11
    last_word_idx: 16
    text: "leaving three real worlds on Earth"
  - seg_id: "N08"
    first_word_idx: 17
    last_word_idx: 20
    text: "that look completely impossible."

