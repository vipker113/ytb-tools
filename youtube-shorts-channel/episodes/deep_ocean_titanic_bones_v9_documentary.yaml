factual_references:
  - citation: "NOAA Ocean Exploration & Robert Ballard / Institute for Exploration (2004). Return to Titanic Expedition (June 2004, NOAA Ship Ronald H. Brown & ROV Hercules, 3,800 m North Atlantic)."
    url: "https://archive.oceanexplorer.noaa.gov/explorations/04titanic/welcome.html"
    supported_claims: "RMS Titanic rests ~3,800 meters (~4 km / 12,500 ft) beneath the North Atlantic under ~380 atmospheres of hydrostatic pressure in 1–2°C deep water; ROV surveys documented tanned leather boots and shoes lying in matched pairs on the debris-field sediment where victims settled, while zero exposed human bones have ever been observed across the exterior wreck or debris field (with oceanographers noting sealed, anoxic interior hull spaces could theoretically shelter isolated fragments)."
  - citation: "Tresguerres, M., Katz, S., & Rouse, G. W. (2013). How to get into bones: proton pump and carbonic anhydrase in Osedax boneworms. Proceedings of the Royal Society B, 280(1761), 20130625; paired with Smith, C. R., & Baco, A. R. (2003). Ecology of whale falls at the deep-sea floor. Oceanography and Marine Biology: An Annual Review, 41, 311–354, and Covington, A. D. (2009). Tanning Chemistry: The Science of Leather (RSC Publishing)."
    url: "https://doi.org/10.1098/rspb.2013.0625"
    supported_claims: "Deep-sea scavengers strip vertebrate soft tissue within weeks; exposed hydroxyapatite (calcium-phosphate) bone matrix in cold, mineral-undersaturated abyssal seawater is progressively dissolved over ~5–30 years by seawater undersaturation and acid-secreting marine microbes/bone-degrading organisms, whereas early-20th-century vegetable tanning with oak-bark tannic acid cross-links hide collagen into a bacteria-resistant polymer capable of enduring over 110 years on the seafloor."

