primary_title: "How NASA Flew Over an Ancient River on Mars"
alternative_title: "Inside Jezero Crater: Flight and Ancient Water on Mars"
youtube_description: "A two-and-a-half-minute documentary exploring how Ingenuity achieved powered flight in Mars's ultra-thin air to scout Jezero Crater's ancient river delta for Perseverance."
hashtags: ["#mars", "#nasa", "#perseverance", "#spaceexploration", "#documentary"]
