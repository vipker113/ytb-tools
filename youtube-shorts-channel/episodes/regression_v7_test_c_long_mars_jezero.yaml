  Jezero: "Jez-eh-roh"
  biosignatures: "bio-signatures"

narration_segments:
  - seg_id: "N01"
    text: "Mars holds an atmosphere ninety-nine percent thinner than Earth's. Yet inside a bone-dry Martian basin, a four-pound rotorcraft spun up its blades and lifted off."
    delivery: "MYSTERIOUS"
    emotional_tone: "curious_restraint"
    pace: "SLOW"
    energy: 2
    pause_after_s: 0.46
    emphasis_words: ["ninety-nine percent", "lifted off"]
    narrative_beat: "opening_hook"
    viewer_question: "How can a rotorcraft fly where there is almost no air?"
    new_information: "Ingenuity achieved powered aerodynamic flight in an atmosphere 99% thinner than Earth's."

  - seg_id: "N02"
    text: "That basin is Jezero Crater, forty-five kilometers wide. Orbital cameras mapped a fan-shaped river delta carved by liquid water over three billion years ago. Landing a rover safely among its boulder fields took years of planning."
    delivery: "CALM_EXPLORATION"
    emotional_tone: "immersive_scale"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.45
    emphasis_words: ["Jezero Crater", "river delta", "three billion"]
    narrative_beat: "curiosity_gap"
    viewer_question: "Why did NASA target Jezero Crater despite dangerous terrain?"
    new_information: "Orbital imagery revealed a preserved 3.5-billion-year-old river delta inside Jezero Crater."

  - seg_id: "N03"
    text: "In February 2021, a rocket-powered sky crane lowered the Perseverance rover onto that ancient lake floor. Tucked beneath the rover's belly rode Ingenuity, folded tight against freezing minus ninety degree nights."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "measured_precision"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.45
    emphasis_words: ["sky crane", "minus ninety"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "How did Ingenuity reach the Martian surface intact?"
    new_information: "Perseverance delivered Ingenuity beneath its chassis and survived -90 C nights."

  - seg_id: "N04"
    text: "On Earth, helicopters push against dense air at a few hundred revolutions per minute. On Mars, surface pressure matches Earth's sky thirty kilometers high. Standard blades would spin without generating enough lift to leave the ground."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "precise_clarity"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.45
    emphasis_words: ["thirty kilometers", "lift"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "Why do ordinary helicopter designs fail on Mars?"
    new_information: "Martian surface air density equals Earth's stratosphere at 30 kilometers altitude."

  - seg_id: "N05"
    text: "Engineers solved the physics problem with ultra-stiff carbon-fiber rotors spanning four feet across. Counter-rotating blades spin past two thousand five hundred revolutions per minute. Because radio signals take minutes to arrive, onboard cameras steer every flight alone."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "focused_engineering"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.48
    emphasis_words: ["carbon-fiber", "two thousand five hundred", "steer"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "How did JPL engineer lift and autonomous control in 1% air?"
    new_information: "Counter-rotating carbon blades at 2,500 RPM and autonomous visual navigation enabled flight."

  - seg_id: "N06"
    text: "What began as a thirty-day, five-flight test soon changed the entire surface mission. Ingenuity flew seventy-two times over nearly three years, scouting sand ripples and steep ridges from above. Those aerial maps guided Perseverance straight toward the ancient river mouth."
    delivery: "SURPRISED_BUT_CONTROLLED"
    emotional_tone: "controlled_discovery"
    pace: "NATURAL"
    energy: 4
    pause_before_s: 0.18
    pause_after_s: 0.48
    emphasis_words: ["seventy-two times", "three years", "ancient river"]
    narrative_beat: "escalation"
    viewer_question: "How did a technology demo transform Mars surface science?"
    new_information: "Ingenuity completed 72 flights across nearly three years as an aerial scout."

  - seg_id: "N07"
    text: "At the delta front, rover cameras revealed tilted stone layers stacked above fine-grained mudstones. On Earth, slow lake currents trap organic molecules inside clay and silt. Rounded cobbles higher up point to sudden, high-energy floods."
    delivery: "CALM_EXPLORATION"
    emotional_tone: "observational_wonder"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.46
    emphasis_words: ["mudstones", "organic molecules", "floods"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "What geological history did Perseverance uncover in the delta rocks?"
    new_information: "Mudstones record calm habitable lake waters, capped by boulder conglomerates from late floods."

  - seg_id: "N08"
    text: "Using its rotary coring drill, Perseverance cut finger-sized rock cores from those ancient lake beds. Each core was measured, photographed, and sealed inside an airtight titanium tube."
    delivery: "SCIENTIFIC_AUTHORITY"
    emotional_tone: "deliberate_focus"
    pace: "NATURAL"
    energy: 3
    pause_after_s: 0.46
    emphasis_words: ["rock cores", "titanium tube"]
    narrative_beat: "evidence_and_discovery"
    viewer_question: "How is Perseverance preserving Martian rock evidence?"
    new_information: "Perseverance drilled and hermetically sealed intact delta mudstone cores in titanium tubes."

  - seg_id: "N09"
    text: "Ultraviolet laser scans inside the rover detected carbonate minerals, phosphate grains, and carbon-bearing compounds locked inside those lake sediments. Every ingredient needed for ancient habitable water once met on this crater floor."
    delivery: "CINEMATIC_REVEAL"
    emotional_tone: "earned_significance"
    pace: "SLOW"
    energy: 4
    pause_before_s: 0.18
    pause_after_s: 0.50
    emphasis_words: ["carbonate", "carbon-bearing", "habitable water"]
    narrative_beat: "payoff"
    viewer_question: "What chemical clues did rover instruments detect inside the delta?"
    new_information: "Laser spectroscopy confirmed carbonates, phosphates, and organic-bearing minerals."

  - seg_id: "N10"
    text: "Planetary scientists are still studying whether those carbon compounds formed through non-living chemistry or ancient microbial life. Until Earth laboratories open the sealed tubes, Mars's biological past remains an open question across a silent red horizon."
    delivery: "EMOTIONAL_REFLECTION"
    emotional_tone: "credible_wonder"
    pace: "SLOW"
    energy: 2
    pause_after_s: 0.50
    emphasis_words: ["still studying", "open question"]
    narrative_beat: "final_impression"
    viewer_question: "Does organic carbon in Jezero mudstones prove ancient Martian life?"
    new_information: "Abiotic geology can also produce organics, so laboratory sample return remains essential."

