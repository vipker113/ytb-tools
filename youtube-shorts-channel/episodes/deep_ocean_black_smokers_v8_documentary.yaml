factual_references:
  - citation: "Van Dover, C. L., Szuts, E. Z., Chamberlain, S. C., & Cann, J. R. (1989). A novel eye in 'eyeless' shrimp from hydrothermal vents of the Mid-Atlantic Ridge. Nature, 337, 458–460."
    url: "https://doi.org/10.1038/337458a0"
    supported_claims: "Rimicaris exoculata lacks normal image-forming eyes and possesses a reflective dorsal rhodopsin photoreceptor organ sensitive to faint thermal radiation from ~350°C vents."
  - citation: "Petersen, J. M. et al. (2011). Hydrogen is an energy source for hydrothermal vent symbioses. Nature, 476, 176–180; Ponsard, J. et al. (2013). Inorganic carbon fixation by chemosynthetic ectosymbionts of Rimicaris exoculata. ISME Journal, 7, 96–109."
    url: "https://doi.org/10.1038/nature10325"
    supported_claims: "Chemosynthetic ectosymbiotic bacteria inside Rimicaris gill chambers oxidize hydrogen sulfide and reduced compounds to nourish dense (~2,500/m²) shrimp swarms without sunlight."
  - citation: "Humphris, S. E. et al. (1995). The internal structure of an active sea-floor massive sulphide deposit (TAG hydrothermal mound, 3,670 m, Mid-Atlantic Ridge). Nature, 377, 713–716; Martin, W. et al. (2008). Hydrothermal vents and the origin of life. Nature Reviews Microbiology, 6, 805–814."
    url: "https://doi.org/10.1038/377713a0"
    supported_claims: "At ~3,600 m (~360 bar hydrostatic pressure), ~360°C hydrothermal fluids remain liquid without boiling, precipitate metal-sulfide chimneys upon mixing with ~2°C seawater, and serve as a leading (though debated vs. terrestrial hot springs) model for abiogenesis and icy-moon astrobiology."
